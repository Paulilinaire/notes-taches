<!DOCTYPE html>
<html lang="fr" data-theme="bonbon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="color-scheme" content="light">
<title>To-Doudou</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

  <defs>

    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M5 6h15l-1.8 8.2a2 2 0 0 1-2 1.6H8.6a2 2 0 0 1-2-1.6Z" fill="currentColor" opacity=".35"/><path d="M2.5 3.5h2.3l2.6 11.4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="9" cy="19.5" r="2" fill="currentColor"/><circle cx="17" cy="19.5" r="2" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7.5 10V7.8a4.5 4.5 0 0 1 9 0V10" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="4" y="10" width="16" height="11.5" rx="5" fill="currentColor"/><circle cx="12" cy="15.5" r="1.8" fill="#fff" opacity=".8"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><path d="M7.5 10V7.8a4.5 4.5 0 0 1 8.7-1.6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="4" y="10" width="16" height="11.5" rx="5" fill="currentColor"/><circle cx="12" cy="15.5" r="1.8" fill="#fff" opacity=".8"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.5c3.8 4.6 6.5 8.4 6.5 12a6.5 6.5 0 0 1-13 0c0-3.6 2.7-7.4 6.5-12Z" fill="currentColor"/><path d="M9 15a3 3 0 0 0 3 3" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".8"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 6 6v4l2 3H4l2-3V9a6 6 0 0 1 6-6Z" fill="currentColor"/><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0" fill="currentColor" opacity=".45"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="5" fill="currentColor" opacity=".35"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4" fill="currentColor" opacity=".35"/><circle cx="8.5" cy="11" r="2.3" fill="currentColor"/><path d="M5 16.3c.6-1.6 2-2.4 3.5-2.4s2.9.8 3.5 2.4" fill="currentColor"/><path d="M14.5 10h4M14.5 13.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-tax" viewBox="0 0 24 24"><path d="M12 3 21 8H3Z" fill="currentColor"/><path d="M5.5 10v7M10 10v7M14 10v7M18.5 10v7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".45"/><rect x="3" y="18" width="18" height="3" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.4A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 8 2.5c0 5.8-8 10.4-8 10.4Z" fill="currentColor"/></symbol>
    <symbol id="i-tooth" viewBox="0 0 24 24"><path d="M7.5 3.5c1.6 0 2.8.8 4.5.8s2.9-.8 4.5-.8C19 3.5 20.5 5.5 20 8.5c-.4 2.4-1.5 3.6-1.9 6.4-.4 2.8-.9 5.6-2.3 5.6-1.6 0-1.5-4.5-3.8-4.5s-2.2 4.5-3.8 4.5c-1.4 0-1.9-2.8-2.3-5.6C5.5 12.1 4.4 10.9 4 8.5 3.5 5.5 5 3.5 7.5 3.5Z" fill="currentColor"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3h3l1.5 4.5-2 1.5a11 11 0 0 0 6 6l1.5-2 4.5 1.5v3a2.5 2.5 0 0 1-2.5 2.5A15.5 15.5 0 0 1 4 5.5 2.5 2.5 0 0 1 6.5 3Z" fill="currentColor"/></symbol>
    <symbol id="i-pill" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="4" transform="rotate(-35 12 12)" fill="currentColor" opacity=".35"/><path d="M12 12 8.7 16.7a4 4 0 0 1-6.6-4.6L5.4 7.4" transform="translate(1.2 .3)" fill="currentColor"/></symbol>
    <symbol id="i-school" viewBox="0 0 24 24"><path d="M12 4 22 9l-10 5L2 9Z" fill="currentColor"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5L12 14.5Z" fill="currentColor" opacity=".45"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2c.8 4.6 2.4 6.2 7 7-4.6.8-6.2 2.4-7 7-.8-4.6-2.4-6.2-7-7 4.6-.8 6.2-2.4 7-7Z" fill="currentColor"/><path d="M19 15c.4 2 1 2.6 3 3-2 .4-2.6 1-3 3-.4-2-1-2.6-3-3 2-.4 2.6-1 3-3Z" fill="currentColor" opacity=".6"/></symbol>
    <symbol id="i-veg" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7" fill="currentColor"/><path d="M12 7c0-2 1-3.5 3-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/><path d="M12 7c-2.5-1.5-4.5-.5-5 1 2 .8 3.5.5 5-1Z" fill="currentColor" opacity=".6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 21 10.5V19a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 19v-8.5Z" fill="currentColor" opacity=".35"/><rect x="9" y="13" width="6" height="8.5" rx="2" fill="currentColor"/><path d="M2 11 12 2.5 22 11" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="5" rx="2" fill="currentColor"/><rect x="4.5" y="14" width="15" height="7.5" rx="2.5" fill="currentColor" opacity=".35"/><path d="M12 9v12.5M12 9C10 5 6.5 5 6.5 7S9 9 12 9Zm0 0c2-4 5.5-4 5.5-2S15 9 12 9Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.3 2.5h3.4l.6 2.6 2 1.1 2.5-.9 1.7 2.9-2 1.8v2.3l2 1.8-1.7 2.9-2.5-.9-2 1.1-.6 2.6h-3.4l-.6-2.6-2-1.1-2.5.9L3.5 16l2-1.8v-2.3l-2-1.8 1.7-2.9 2.5.9 2-1.1Z" fill="currentColor" opacity=".4"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="3.5" fill="currentColor"/><path d="M16 5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M15.5 4.5 19.5 8.5 9 19H5v-4Z" fill="currentColor"/><path d="M4 21.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".45"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M12 6v12M12 6l-4 4M12 6l4 4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="18" width="16" height="3" rx="1.5" fill="currentColor" opacity=".45"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="18" width="16" height="3" rx="1.5" fill="currentColor" opacity=".45"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="18.5" cy="12" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-uterus" viewBox="0 0 24 24"><path d="M7.6 7.4C6.3 5.3 4.1 4.8 3.1 6.4M16.4 7.4c1.3-2.1 3.5-2.6 4.5-1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".6"/><ellipse cx="3.7" cy="9.2" rx="1.8" ry="2.1" fill="currentColor" opacity=".45"/><ellipse cx="20.3" cy="9.2" rx="1.8" ry="2.1" fill="currentColor" opacity=".45"/><path d="M7 7.6C7 6.6 7.8 6 8.6 6h6.8c.8 0 1.6.6 1.6 1.6 0 3.6-1.7 6.1-3.3 7v3.7a1.7 1.7 0 0 1-3.4 0v-3.7C8.7 13.7 7 11.2 7 7.6Z" fill="currentColor"/><path d="M10 8.6c.4 1.6 1.1 2.6 2 3.1.9-.5 1.6-1.5 2-3.1" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <main class="screens">
    <section class="screen" id="s-plan" aria-label="Planning">
      <header class="hero h-plan">
        <div class="hero-row">
          <div>
            <div class="hello" id="plan-date"></div>
            <h1 class="title" id="plan-hello">Bonjour</h1>
          </div>
          <button class="round" id="open-settings" aria-label="Paramètres"><svg width="22" height="22"><use href="#i-gear"/></svg></button>
        </div>
      </header>
      <div class="body">
        <div id="banners"></div>
        <div class="cal" id="cal">
          <div class="calhead">
            <button class="nav" id="cal-prev" aria-label="Mois précédent"><svg width="18" height="18"><use href="#i-left"/></svg></button>
            <button class="cal-title" id="cal-title"></button>
            <button class="nav" id="cal-next" aria-label="Mois suivant"><svg width="18" height="18"><use href="#i-right"/></svg></button>
          </div>
          <div class="grid" id="grid"></div>
        </div>
        <div class="section" id="day-title"></div>
        <div id="day-list"></div>
      </div>
    </section>

    <section class="screen hide-right" id="s-courses" aria-label="Courses">
      <header class="hero h-shop">
        <div class="hero-row">
          <div>
            <div class="hello">Liste de courses</div>
            <h1 class="title"><svg width="28" height="28"><use href="#i-cart"/></svg> <span id="shop-title"></span></h1>
          </div>
          <button class="round" id="list-menu" aria-label="Options de la liste"><svg width="22" height="22"><use href="#i-dots"/></svg></button>
        </div>
        <div class="progress"><div id="prog"></div></div>
        <div class="ptxt" id="ptxt"></div>
      </header>
      <div class="body">
        <div class="chips" id="list-chips"></div>
        <div class="listcard">
          <form class="add" id="add-item">
            <input id="new-item" placeholder="Ajouter un article…" autocomplete="off" enterkeyhint="done" maxlength="80">
            <button aria-label="Ajouter"><svg width="20" height="20"><use href="#i-plus"/></svg></button>
          </form>
          <div id="shop"></div>
        </div>
        <div class="row-actions" id="shop-actions">
          <button class="soft" data-shop="uncheck">Tout décocher</button>
          <button class="soft" data-shop="clear">Retirer les cochés</button>
        </div>
      </div>
    </section>

    <section class="screen hide-right" id="s-cycle" aria-label="Cycle">
      <header class="hero h-cycle">
        <div class="hero-row">
          <div>
            <div class="hello">Suivi des règles</div>
            <h1 class="title"><svg width="30" height="30"><use href="#i-uterus"/></svg> Cycle</h1>
          </div>
        </div>
      </header>
      <div class="body" id="cycle-body"></div>
    </section>

    <section class="screen hide-right" id="s-vault" aria-label="Coffre">
      <header class="hero h-vault">
        <div class="hero-row">
          <div>
            <div class="hello" id="vault-sub"></div>
            <h1 class="title">Coffre</h1>
          </div>
          <button class="round" id="vault-lock" aria-label="Verrouiller" hidden><svg width="22" height="22"><use href="#i-lock"/></svg></button>
        </div>
      </header>
      <div class="body" id="vault-body"></div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="Ajouter"><svg width="26" height="26"><use href="#i-plus"/></svg></button>

  <nav class="tabs" id="tabs">
    <button class="tab on" style="--tc:var(--b)" data-tab="0"><svg width="22" height="22"><use href="#i-cal"/></svg><span class="lbl">Planning</span></button>
    <button class="tab" style="--tc:var(--c)" data-tab="1"><svg width="22" height="22"><use href="#i-cart"/></svg><span class="lbl">Courses</span></button>
    <button class="tab" style="--tc:var(--a)" data-tab="2"><svg width="22" height="22"><use href="#i-uterus"/></svg><span class="lbl">Cycle</span></button>
    <button class="tab" style="--tc:linear-gradient(135deg,var(--b),var(--a))" data-tab="3"><svg width="22" height="22"><use href="#i-lock"/></svg><span class="lbl">Coffre</span></button>
  </nav>

  <div class="veil" id="veil"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>
</body>
</html>
